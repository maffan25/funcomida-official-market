<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Funcomida Official Store</title>
<meta name="description" content="Toko aplikasi dan produk digital Funcomida.">
<meta name="theme-color" content="#FDF1E3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧡</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDF1E3;--card:#fff;--ink:#2B1708;--soft:#8A6A50;--o1:#FF9A3C;--o2:#E8590C;--o3:#B93D05;--line:#F3D9BC;--glass:rgba(255,255,255,.62)}
@media(prefers-color-scheme:dark){:root{--bg:#1B110A;--card:#2A1B10;--ink:#FFF1E0;--soft:#C9A584;--line:#4A3120;--glass:rgba(42,27,16,.7)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:110px;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--o2);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;background:linear-gradient(135deg,var(--o1),var(--o3));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--soft);-webkit-text-fill-color:var(--soft)}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);box-shadow:0 4px 14px rgba(232,89,12,.15)}
.ic svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;width:66px;text-align:center;font-size:12px;font-weight:500}
.ring{width:66px;height:66px;border-radius:50%;padding:3px;background:conic-gradient(var(--o1),var(--o3),var(--o1));display:grid;place-items:center}
.ring span{width:100%;height:100%;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:26px;border:2px solid var(--bg)}
.ring.on{background:var(--ink)}
.st p{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 0;scrollbar-width:none}
.promo::-webkit-scrollbar{display:none}
.pc{flex:0 0 86%;scroll-snap-align:start;border-radius:26px;padding:20px;color:#fff;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 14px 30px rgba(232,89,12,.28)}
.pc::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.22);filter:blur(2px)}
.pc h3{font-size:22px;font-weight:800;letter-spacing:-.4px;position:relative}
.pc p{font-size:13px;opacity:.92;margin:4px 0 12px;position:relative}
.kode{align-self:flex-start;background:rgba(255,255,255,.25);border:1px dashed #fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;position:relative}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
.chip.on{background:linear-gradient(135deg,var(--o1),var(--o2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(232,89,12,.35)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:0 14px;margin:12px 0 0;border:1px solid var(--line)}
.search input{flex:1;border:0;background:none;padding:14px 0;font:inherit;color:var(--ink);outline:0}
.feed{display:grid;gap:18px;padding:8px 0}
@media(min-width:760px){.wrap{max-width:980px}.feed{grid-template-columns:repeat(2,1fr)}.pc{flex-basis:46%}}
.post{background:var(--card);border-radius:28px;overflow:hidden;box-shadow:0 10px 28px rgba(122,60,10,.12);border:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--o1),var(--o3));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.ph b{font-size:14px;display:block}.ph small{color:var(--soft);font-size:12px}
.badge{margin-left:auto;background:#FFE7CF;color:var(--o3);font-weight:800;font-size:12px;padding:5px 12px;border-radius:999px}
.cover{display:block;aspect-ratio:4/3;margin:0 10px;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--o1),var(--o3));display:grid;place-items:center}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .em{font-size:76px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}
.disc{position:absolute;left:12px;bottom:12px;background:#fff;color:var(--o3);font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;z-index:1}
.act{display:flex;align-items:center;gap:6px;padding:10px 12px 0}
.act button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.act svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act .lk.on svg{fill:#F0384B;stroke:#F0384B}
.cta{margin-left:auto;background:linear-gradient(135deg,var(--o1),var(--o2));color:#fff!important;width:auto!important;border-radius:999px!important;padding:0 18px;font-weight:700;font-size:14px;height:40px;box-shadow:0 8px 18px rgba(232,89,12,.35)}
.pb{padding:4px 18px 18px}
.pb h2{font-size:18px;font-weight:800;letter-spacing:-.3px}
.pb p{color:var(--soft);font-size:14px;margin:3px 0 8px;line-height:1.5}
.price{font-weight:800;font-size:20px;color:var(--o2)}
.price s{color:var(--soft);font-size:13px;font-weight:500;margin-left:8px}
.empty{text-align:center;color:var(--soft);padding:40px 10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
.nav>div{max-width:520px;margin:0 auto;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:30px;display:flex;justify-content:space-around;align-items:center;padding:8px 6px;box-shadow:0 14px 36px rgba(122,60,10,.22)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--soft);padding:6px 12px;min-width:60px}
.nav a.on{color:var(--o2)}
.fab{width:60px!important;height:60px;min-width:0!important;border-radius:22px;background:linear-gradient(135deg,var(--o1),var(--o3));color:#fff!important;margin-top:-30px;padding:0!important;justify-content:center;box-shadow:0 12px 26px rgba(232,89,12,.5);border:4px solid var(--bg)}
.fab svg{width:26px;height:26px}
.back{display:inline-flex;align-items:center;gap:8px;margin:14px 0 8px;font-weight:700}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal>*{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;border-radius:26px;object-fit:cover;border:0;background:linear-gradient(135deg,var(--o1),var(--o3));display:grid;place-items:center;font-size:96px}
.box{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;margin:14px 0;box-shadow:0 10px 28px rgba(122,60,10,.1)}
.box h1{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
.box p{line-height:1.65;color:var(--soft);margin-top:10px}
.feat{list-style:none;padding:0;margin-top:12px;display:grid;gap:8px}
.feat li{display:flex;gap:10px;align-items:center;font-weight:500}
.feat li::before{content:"✓";width:22px;height:22px;border-radius:50%;background:#FFE7CF;color:var(--o3);display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:20px;padding:16px;font-weight:800;margin-top:10px;width:100%}
.b1{background:linear-gradient(135deg,var(--o1),var(--o2));color:#fff;box-shadow:0 12px 24px rgba(232,89,12,.4)}
.b2{background:var(--card);border:2px solid var(--o2);color:var(--o2)}
.bar{position:sticky;bottom:96px;z-index:5}
.pf{text-align:center;padding:26px 20px}
.pf .av{width:84px;height:84px;font-size:36px;margin:0 auto 12px}
.links{display:grid;gap:10px;margin-top:16px}
.vid{width:100%;aspect-ratio:16/9;border:0;border-radius:22px;margin-top:14px;background:#000}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.toast{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a href="#/" class="logo" id="logo"></a>
  <div style="display:flex;gap:8px">
    <button class="ic" id="btnLike" aria-label="Produk disukai"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
    <a class="ic" id="btnWa" aria-label="Chat WhatsApp"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.5 7.3L3 20l1.3-5A8.4 8.4 0 1 1 21 11.5z"/></svg></a>
  </div>
</div></header>
<main class="wrap" id="app"></main>
<nav class="nav"><div>
  <a href="#/" data-n="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Beranda</a>
  <a href="#/cari" data-n="cari"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Cari</a>
  <a class="fab" id="fab" aria-label="Chat penjual"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.5 7.3L3 20l1.3-5A8.4 8.4 0 1 1 21 11.5z"/><path d="M12 8v6M9 11h6"/></svg></a>
  <a href="#/promo" data-n="promo"><svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>Promo</a>
  <a href="#/profil" data-n="profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profil</a>
</div></nav>
<div class="toast" id="toast"></div>
<script src="products.js"></script>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const rp=n=>"Rp"+Number(n).toLocaleString("id-ID");
let kat="Semua", q="", liked=[];
try{liked=JSON.parse(localStorage.getItem("fc_likes")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("fc_likes",JSON.stringify(liked))}catch(e){}};
const wa=t=>"https://wa.me/"+TOKO.whatsapp+"?text="+encodeURIComponent(t||"Halo "+TOKO.nama+", saya mau tanya produk.");
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)};
const pct=p=>p.hargaCoret>p.harga?Math.round((1-p.harga/p.hargaCoret)*100):0;
$("#logo").innerHTML=TOKO.nama.replace(" Official Store","")+"<small>Official Store</small>";
$("#btnWa").href=wa();$("#fab").href=wa();
$("#btnLike").onclick=()=>{location.hash="#/disukai"};
const heart='<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
const share='<svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>';
const cats=()=>["Semua",...new Set(PRODUK.map(p=>p.kategori))];

function cover(p){
  const d=pct(p);
  return `<span class="cover">${p.gambar[0]?`<img src="${p.gambar[0]}" alt="${p.nama}" loading="lazy">`:`<span class="em">${p.emoji||"🎁"}</span>`}${d?`<span class="disc">Hemat ${d}%</span>`:""}</span>`;
}
function post(p){
  return `<article class="post">
  <div class="ph"><div class="av">${p.nama[0]}</div><div><b>${p.nama}</b><small>${p.kategori} · ${TOKO.nama}</small></div>${p.badge?`<span class="badge">${p.badge}</span>`:""}</div>
  <a href="#/produk/${p.id}">${cover(p)}</a>
  <div class="act"><button class="lk ${liked.includes(p.id)?"on":""}" data-like="${p.id}" aria-label="Suka">${heart}</button><button data-share="${p.id}" aria-label="Bagikan">${share}</button><a class="cta ic" href="#/produk/${p.id}" style="display:grid;place-items:center">Lihat produk</a></div>
  <div class="pb"><h2>${p.nama}</h2><p>${p.ringkas}</p><div class="price">${rp(p.harga)}${p.hargaCoret>p.harga?`<s>${rp(p.hargaCoret)}</s>`:""}</div></div></article>`;
}
function list(arr){return arr.length?`<div class="feed">${arr.map(post).join("")}</div>`:`<div class="empty">Belum ada produk yang cocok. Coba kata kunci lain.</div>`}
function filt(){return PRODUK.filter(p=>(kat==="Semua"||p.kategori===kat)&&(p.nama+p.ringkas).toLowerCase().includes(q.toLowerCase()))}
function promoCards(){return `<div class="promo">${PROMO.map(x=>`<div class="pc" style="background:linear-gradient(135deg,${x.warna},#FF9A3C)"><h3>${x.judul}</h3><p>${x.teks}</p><button class="kode" data-kode="${x.kode}">Salin kode ${x.kode}</button></div>`).join("")}</div>`}
function chipsH(){return `<div class="chips">${cats().map(c=>`<button class="chip ${c===kat?"on":""}" data-kat="${c}">${c}</button>`).join("")}</div>`}

function home(){
  app.innerHTML=`<div class="stories"><a class="st" href="#/promo"><div class="ring"><span>🔥</span></div><p>Promo</p></a>${PRODUK.map(p=>`<a class="st" href="#/produk/${p.id}"><div class="ring"><span>${p.emoji||"🎁"}</span></div><p>${p.nama}</p></a>`).join("")}</div>${promoCards()}${chipsH()}<div id="lst">${list(filt())}</div>`;
}
function cari(){
  app.innerHTML=`<label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="qi" placeholder="Cari aplikasi atau produk" value="${q}"></label>${chipsH()}<div id="lst">${list(filt())}</div>`;
  const i=$("#qi");i.oninput=()=>{q=i.value;$("#lst").innerHTML=list(filt())};
}
function promo(){app.innerHTML=`<h1 style="margin:18px 0 4px;font-size:24px">Promo hari ini</h1>${promoCards()}<h2 style="margin:16px 0 4px;font-size:18px">Produk yang lagi diskon</h2>${list(PRODUK.filter(p=>pct(p)>0))}`}
function disukai(){app.innerHTML=`<h1 style="margin:18px 0 4px;font-size:24px">Produk disukai</h1>${list(PRODUK.filter(p=>liked.includes(p.id)))}`}
function profil(){
  app.innerHTML=`<div class="box pf"><div class="av">F</div><h1 style="font-size:22px">${TOKO.nama}</h1><p>${TOKO.slogan}</p><div class="links"><a class="btn b1" href="${wa()}" target="_blank" rel="noopener">Chat lewat WhatsApp</a><a class="btn b2" href="${TOKO.lykd}" target="_blank" rel="noopener">Buka halaman Lykd</a><a class="btn b2" href="${TOKO.instagram}" target="_blank" rel="noopener">Instagram</a></div></div>`;
}
function vid(u){
  if(!u)return "";
  const m=u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
  return m?`<iframe class="vid" src="https://www.youtube.com/embed/${m[1]}" allowfullscreen title="Video produk"></iframe>`:`<video class="vid" src="${u}" controls playsinline></video>`;
}
function detail(id){
  const p=PRODUK.find(x=>x.id===id);
  if(!p){app.innerHTML=`<div class="empty">Produk tidak ditemukan.<br><a class="btn b1" href="#/">Kembali ke beranda</a></div>`;return}
  const g=p.gambar.length?p.gambar.map(s=>`<img src="${s}" alt="${p.nama}" loading="lazy">`).join(""):`<div>${p.emoji||"🎁"}</div>`;
  app.innerHTML=`<a class="back" href="#/">← Kembali</a><div class="gal">${g}</div>
  <div class="box"><span class="badge" style="${p.badge?"":"display:none"}">${p.badge}</span><h1 style="margin-top:8px">${p.nama}</h1>
  <div class="price" style="margin-top:8px;font-size:24px">${rp(p.harga)}${p.hargaCoret>p.harga?`<s>${rp(p.hargaCoret)}</s>`:""}</div>
  <p>${p.deskripsi}</p><ul class="feat">${p.fitur.map(f=>`<li>${f}</li>`).join("")}</ul>${vid(p.video)}</div>
  <div class="bar"><a class="btn b1" href="${p.linkBeli}" target="_blank" rel="noopener">Beli langsung</a>${p.linkLykd?`<a class="btn b2" style="background:var(--bg)" href="${p.linkLykd}" target="_blank" rel="noopener">Beli lewat Lykd</a>`:""}</div>`;
  document.title=p.nama+" | "+TOKO.nama;
}
function route(){
  const h=location.hash||"#/", [,a,b]=h.split("/");
  document.title=TOKO.nama;
  ({"":home,cari,promo,profil,disukai}[a||""]||(a==="produk"?()=>detail(b):home))();
  document.querySelectorAll(".nav a[data-n]").forEach(x=>x.classList.toggle("on",x.dataset.n===(a||"home")));
  scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;
  if(t.dataset.kat){kat=t.dataset.kat;route()}
  if(t.dataset.like){const i=liked.indexOf(t.dataset.like);i<0?liked.push(t.dataset.like):liked.splice(i,1);save();t.classList.toggle("on");toast(i<0?"Disimpan ke disukai":"Dihapus dari disukai")}
  if(t.dataset.share){const p=PRODUK.find(x=>x.id===t.dataset.share),u=location.origin+location.pathname+"#/produk/"+p.id;
    if(navigator.share)navigator.share({title:p.nama,url:u}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(u);toast("Tautan disalin")}}
  if(t.dataset.kode){navigator.clipboard&&navigator.clipboard.writeText(t.dataset.kode);toast("Kode "+t.dataset.kode+" disalin")}
});
addEventListener("hashchange",route);route();
</script>
</body>
</html>
