<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Funcomida Official Store</title>
<meta name="description" content="Toko resmi produk digital Funcomida: aplikasi, website, template, e-book dan preset.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Warna diatur dari admin (tab Tampilan) lewat data.json. Nilai di bawah hanya cadangan. */
:root{--pri:#6C4DFF;--acc:#FFE14D;--bg:#F1EEFF;--ink:#1B1464;--mute:color-mix(in srgb,var(--ink) 68%,#fff);--bd:2.5px solid var(--ink);--sh:5px 5px 0 var(--ink)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font:500 15px/1.55 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.logo,.price b,.big b,.stats b,.av,.tag,.tk div{font-family:'Bricolage Grotesque',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--pri);outline-offset:3px}
.c{max-width:1120px;margin:0 auto;padding:0 20px}
.ann{background:var(--ink);color:var(--acc);text-align:center;font-weight:700;font-size:13px;padding:9px 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:var(--bd)}
.hd{display:flex;align-items:center;gap:10px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo i{font-style:normal;background:var(--acc);border:var(--bd);width:36px;height:36px;border-radius:12px;display:grid;place-items:center;transform:rotate(-8deg);box-shadow:2px 2px 0 var(--ink)}
.dn{display:none;gap:4px;margin-left:14px}.dn a{padding:8px 14px;border-radius:999px;font-weight:700}.dn a.on{background:var(--ink);color:#fff}
.wa{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:#fff;border:var(--bd);border-radius:14px;padding:12px 20px;font-weight:800;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.y{background:var(--acc);color:var(--ink)}.btn.wh{background:#fff;color:var(--ink)}.btn.s{padding:8px 14px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}.btn.full{width:100%}
.hero{display:grid;gap:30px;padding:34px 0 34px;align-items:center}
.hero h1{font-size:clamp(36px,8.5vw,70px);line-height:1;font-weight:800;letter-spacing:-.035em;max-width:14ch}
.hero p{font-size:17px;max-width:46ch;margin:16px 0 24px;color:var(--mute)}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.proof{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.proof span{background:#fff;border:var(--bd);border-radius:999px;padding:4px 13px;font-weight:700;font-size:13px}
.stack{position:relative;height:330px;width:100%;max-width:400px;margin:0 auto}
.stk{position:absolute;width:62%;background:#fff;border:var(--bd);border-radius:22px;box-shadow:var(--sh);overflow:hidden;transition:transform .15s}
.stk:nth-child(1){left:0;top:34px;transform:rotate(-7deg)}.stk:nth-child(2){right:0;top:0;transform:rotate(5deg);z-index:2}.stk:nth-child(3){left:19%;bottom:0;transform:rotate(-1deg);z-index:3}
.stk:hover{transform:rotate(0) scale(1.03);z-index:4}
.stk .pm{aspect-ratio:4/3;font-size:54px}.stk b{display:block;padding:8px 12px;font-size:13px;line-height:1.25}
.tk{background:var(--acc);border-block:var(--bd);overflow:hidden;white-space:nowrap}
.tk div{display:inline-block;padding:11px 0;font-weight:800;font-size:17px;animation:mq 30s linear infinite}
.tk span{margin:0 22px}.tk span:after{content:"✦";margin-left:44px}
@keyframes mq{to{transform:translateX(-50%)}}
section{margin-top:46px}
h2{font-size:clamp(25px,4.2vw,36px);font-weight:800;line-height:1.1;letter-spacing:-.025em}
.sh{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px}
.sh a{font-weight:800;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.hs{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 18px 4px;margin:0 -20px 0 -4px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}.hs .pc{flex:0 0 min(62%,250px);scroll-snap-align:start}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 14px;margin:0 -4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 16px;border:var(--bd);border-radius:999px;background:#fff;font-weight:800;font-size:14px}.chip.on{background:var(--ink);color:#fff}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.sr{flex:1;min-width:190px;display:flex;align-items:center;gap:10px;background:#fff;border:var(--bd);border-radius:14px;padding:0 14px}
.sr input{flex:1;border:0;outline:0;background:none;padding:12px 0;min-width:0}.sr svg{width:20px;height:20px;flex:none}
.tb select{background:#fff;border:var(--bd);border-radius:14px;padding:0 12px;font-weight:700;height:48px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.pc{background:#fff;border:var(--bd);border-radius:20px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s}
.pc:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.pm{aspect-ratio:1;position:relative;display:grid;place-items:center;font-size:64px;border-bottom:var(--bd);overflow:hidden}
.pm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;left:10px;z-index:2;background:var(--acc);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-weight:800;font-size:12.5px;transform:rotate(-4deg)}
.pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.pb small{color:var(--mute);font-weight:600}.pb h3{font-size:16px;line-height:1.2;font-weight:700}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:4px}.price b{font-size:20px;font-weight:800;color:var(--pri)}.price s{color:var(--mute);font-size:13px}
.soc{display:flex;justify-content:space-between;margin-top:auto;padding-top:10px;font-weight:700;font-size:13px}
.lk{display:flex;gap:5px;align-items:center}.lk svg{width:18px;height:18px}.lk.on{color:#E0245E}.lk.on svg{fill:#E0245E}
.back{display:inline-flex;gap:6px;align-items:center;font-weight:800;margin-top:22px}.back svg{width:20px;height:20px}
.dt{display:grid;gap:28px;padding-top:18px}
.gal{aspect-ratio:1;border:var(--bd);border-radius:28px;box-shadow:var(--sh);position:relative;display:grid;place-items:center;font-size:150px;overflow:hidden}
.gal img,.gal iframe,.gal video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.thumbs{display:flex;gap:10px;margin-top:18px}
.th{width:64px;height:64px;border:var(--bd);border-radius:14px;overflow:hidden;background:#fff;font-weight:800;font-size:12px;display:grid;place-items:center}.th.on{background:var(--acc)}.th img{width:100%;height:100%;object-fit:cover}
.dt h1{font-size:clamp(30px,5vw,46px);line-height:1.05;font-weight:800;letter-spacing:-.03em}
.rate{color:var(--mute);margin-top:8px}.rate b{color:var(--ink)}
.big{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}.big b{font-size:40px;color:var(--pri);font-weight:800}.big s{color:var(--mute)}
.desc{color:var(--mute);max-width:60ch;line-height:1.7}
.fl{list-style:none;padding:0;margin:18px 0;display:grid;gap:10px}.fl li{display:flex;gap:10px;font-weight:600}
.fl li:before{content:"✓";flex:none;width:22px;height:22px;border-radius:7px;background:var(--acc);border:2px solid var(--ink);display:grid;place-items:center;font-size:12px;font-weight:800}
.bds{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.bds span{background:#fff;border:var(--bd);border-radius:999px;padding:5px 13px;font-weight:700;font-size:13px}
.buy{display:grid;gap:12px;margin-top:20px}.row2{display:flex;gap:12px}.row2 .btn{flex:1}
.bb{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:16px}
.bb div{line-height:1.15}.bb small{color:var(--mute);font-weight:600;display:block}.bb b{font:800 22px 'Bricolage Grotesque',sans-serif;color:var(--pri)}.bb .btn{flex:1}
.st{background:#fff;border:var(--bd);border-radius:28px;box-shadow:var(--sh);padding:32px 22px;text-align:center;max-width:520px;margin:34px auto 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.av{width:92px;height:92px;border-radius:50%;background:var(--acc);border:var(--bd);display:grid;place-items:center;font-weight:800;font-size:40px}
.stats{display:flex;gap:28px;margin:4px 0}.stats b{display:block;font-size:24px;font-weight:800}.stats small{color:var(--mute);font-weight:600}
.links{display:grid;gap:12px;width:100%;margin-top:8px}
.empty{text-align:center;color:var(--mute);padding:44px 10px;font-weight:600;border:2.5px dashed var(--ink);border-radius:20px}
.tab{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;background:#fff;border:var(--bd);border-radius:20px;box-shadow:var(--sh);padding:6px;max-width:480px;margin:0 auto}
.tab a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:14px;font-size:11px;font-weight:800}.tab a svg{width:22px;height:22px}.tab a.on{background:var(--pri);color:#fff}
body.det .tab{display:none}
footer{margin-top:60px;border-top:var(--bd);padding:26px 0;text-align:center;font-size:13px;color:var(--mute)}
footer nav{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;font-weight:700;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:24px}}
@media(min-width:800px){.dt{grid-template-columns:1fr 1fr;gap:48px;align-items:start}.bb{display:none}}
@media(min-width:860px){.hero{grid-template-columns:1.15fr .85fr;padding:58px 0 50px}.dn{display:flex}.tab{display:none}body{padding-bottom:40px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="ann" id="ann" hidden></div>
<header><div class="c hd">
  <a href="#/" class="logo" aria-label="Beranda"><i>F</i><span id="brand"></span></a>
  <nav class="dn" id="dn" aria-label="Menu utama"></nav>
  <a class="btn s wa" id="wa" target="_blank" rel="noopener">Chat WhatsApp</a>
</div></header>
<main id="view"></main>
<footer><div class="c" id="foot"></div></footer>
<nav class="tab" id="tab" aria-label="Menu utama"></nav>
<div class="toast" id="toast" role="status"></div>

<script>
/* Semua isi toko (produk, kategori, teks, warna) ada di data.json dan diedit lewat admin.html. */
const SITE0={announce:"",heroTitle:"Produk digital buatan sendiri, siap dipakai hari ini",heroText:"Aplikasi, template, e-book, dan preset. Bayar sekali, langsung dapat akses.",cta:"Lihat semua produk",ticker:"Akses instan\nUpdate gratis\nSupport via WhatsApp",colors:{pri:"#6C4DFF",acc:"#FFE14D",bg:"#F1EEFF",ink:"#1B1464"}};
let STORE={name:"Toko",bio:"",socials:[]},CATEGORIES=[],PRODUCTS=[],SITE=SITE0,ERR=0;
const $=s=>document.querySelector(s),view=$('#view'),R={},S={q:'',sort:'new'};
const rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
const disc=p=>p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;
const fmt=n=>n>=1000?(n/1000).toFixed(1).replace('.',',').replace(',0','')+'rb':n;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let liked=new Set();try{liked=new Set(JSON.parse(localStorage.getItem('fc_liked')||'[]'))}catch(e){}
const saveLiked=()=>{try{localStorage.setItem('fc_liked',JSON.stringify([...liked]))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)};
const I={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',tag:'<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/>',heart:'<path d="M12 20s-8-4.8-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15.2 12 20 12 20z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',back:'<path d="M15 5l-7 7 7 7"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const catName=id=>(CATEGORIES.find(c=>c.id===id)||{}).name||'';

const media=p=>p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`:esc(p.emoji||'🛍️');
function card(p){const d=disc(p),t=p.badge||(d?'-'+d+'%':'');return `<article class="pc" tabindex="0" data-open="${esc(p.id)}">
<div class="pm" style="background:${esc(p.color)}">${media(p)}${t?`<span class="tag">${esc(t)}</span>`:''}</div>
<div class="pb"><small>${esc(catName(p.cat))}</small><h3>${esc(p.name)}</h3>
<div class="price"><b>${rp(p.price)}</b>${p.oldPrice>p.price?`<s>${rp(p.oldPrice)}</s>`:''}</div>
<div class="soc"><button class="lk ${liked.has(p.id)?'on':''}" data-like="${esc(p.id)}" aria-label="Simpan produk">${ic('heart')}<span>${fmt((p.likes||0)+(liked.has(p.id)?1:0))}</span></button>${p.reviews?`<span>★ ${p.rating}</span>`:''}</div></div></article>`}

function list(){let l=R.base.filter(p=>!S.q||(p.name+(p.short||'')).toLowerCase().includes(S.q.toLowerCase()));
 if(S.sort==='low')l=[...l].sort((a,b)=>a.price-b.price);else if(S.sort==='high')l=[...l].sort((a,b)=>b.price-a.price);else if(S.sort==='disc')l=[...l].sort((a,b)=>disc(b)-disc(a));
 return l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="empty">${R.emp}</div>`}
function catalog(cat,base,title,chips,emp){R.base=base;R.emp=emp||'Tidak ada produk yang cocok. Coba kata kunci atau kategori lain.';
 return `<section id="katalog"><div class="sh"><h2>${esc(title)}</h2></div>
${chips?`<div class="chips"><a class="chip ${cat?'':'on'}" href="#/">Semua</a>${CATEGORIES.map(c=>`<a class="chip ${c.id===cat?'on':''}" href="#/kategori/${esc(c.id)}">${esc(c.icon)} ${esc(c.name)}</a>`).join('')}</div>`:''}
<div class="tb"><label class="sr">${ic('search')}<input id="q" type="search" placeholder="Cari produk…" value="${esc(S.q)}" autocomplete="off" aria-label="Cari produk"></label>
<select id="so" aria-label="Urutkan"><option value="new">Terbaru</option><option value="low">Harga termurah</option><option value="high">Harga tertinggi</option><option value="disc">Diskon terbesar</option></select></div>
<div id="res">${list()}</div></section>`}

function home(){const deals=PRODUCTS.filter(p=>p.deal),top=PRODUCTS.slice(0,3),tk=(SITE.ticker||'').split('\n').map(x=>x.trim()).filter(Boolean);
 const set=[...tk,...tk,...tk].map(x=>`<span>${esc(x)}</span>`).join('');
 return `<div class="c"><div class="hero"><div><h1>${esc(SITE.heroTitle)}</h1><p>${esc(SITE.heroText)}</p>
<div class="ctas"><a class="btn" href="#katalog" data-go="katalog">${esc(SITE.cta)}</a><a class="btn wh" href="#/profil">Tentang toko</a></div>
<div class="proof">${STORE.sold?`<span>${esc(STORE.sold)} terjual</span>`:''}${STORE.rating?`<span>★ ${esc(STORE.rating)} rating</span>`:''}${STORE.followers?`<span>${esc(STORE.followers)} pengikut</span>`:''}</div></div>
<div class="stack">${top.map(p=>`<a class="stk" href="#/produk/${esc(p.id)}"><div class="pm" style="background:${esc(p.color)}">${media(p)}</div><b>${esc(p.name)}</b></a>`).join('')}</div></div></div>${tk.length?`<div class="tk" aria-hidden="true"><div>${set+set}</div></div>`:''}<div class="c">
${deals.length?`<section><div class="sh"><h2>Lagi diskon</h2><a href="#/promo">Lihat semua</a></div><div class="hs">${deals.map(card).join('')}</div></section>`:''}
${catalog('',PRODUCTS,'Semua produk',1)}</div>`}

function profile(){return `<div class="st"><div class="av">${esc((STORE.name||'F')[0])}</div><h2>${esc(STORE.name)}</h2><p class="desc">${esc(STORE.bio)}</p>
<div class="stats"><div><b>${esc(STORE.followers)}</b><small>Pengikut</small></div><div><b>${esc(STORE.sold)}</b><small>Terjual</small></div><div><b>★ ${esc(STORE.rating)}</b><small>Rating</small></div></div>
<div class="links">${(STORE.socials||[]).map(s=>`<a class="btn wh" target="_blank" rel="noopener" href="${esc(s.url)}">${esc(s.icon)} ${esc(s.label)}</a>`).join('')}<a class="btn y" target="_blank" rel="noopener" href="https://wa.me/${esc(STORE.whatsapp)}">Chat WhatsApp</a></div></div>`}

function galItem(g){if(g.t==='img')return `<img src="${esc(g.i)}" alt="">`;const m=g.v.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
 return m?`<iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen title="Video produk"></iframe>`:`<video src="${esc(g.v)}" controls playsinline autoplay muted loop></video>`}
function detail(p){if(!p)return '<div class="empty">Produk tidak ditemukan. <a href="#/" style="text-decoration:underline">Kembali ke beranda</a></div>';
 const d=disc(p);R.gal=[];if(p.video)R.gal.push({t:'v',v:p.video});(p.image?[p.image,...(p.gallery||[])]:(p.gallery||[])).forEach(u=>R.gal.push({t:'img',i:u}));
 const buy=`<a class="btn" target="_blank" rel="noopener" href="${esc(p.buyUrl)}">Beli sekarang</a>`;
 return `<a class="back" href="javascript:history.back()">${ic('back')} Kembali</a>
<div class="dt"><div><div class="gal" id="gal" style="background:${esc(p.color)}">${R.gal[0]?galItem(R.gal[0]):esc(p.emoji||'🛍️')}</div>
${R.gal.length>1?`<div class="thumbs">${R.gal.map((g,i)=>`<button class="th ${i?'':'on'}" data-g="${i}" aria-label="Media ${i+1}">${g.t==='img'?`<img src="${esc(g.i)}" alt="">`:'Video'}</button>`).join('')}</div>`:''}</div>
<div><small style="color:var(--mute);font-weight:700">${esc(catName(p.cat))}</small><h1>${esc(p.name)}</h1>
${p.reviews?`<p class="rate">★ <b>${p.rating}</b> · ${Number(p.reviews).toLocaleString('id-ID')} ulasan · ${fmt(p.likes||0)} suka</p>`:''}
<div class="big"><b>${rp(p.price)}</b>${d?`<s>${rp(p.oldPrice)}</s><span class="tag" style="position:static;transform:none">Hemat ${d}%</span>`:''}</div>
<p class="desc">${esc(p.desc)}</p><ul class="fl">${(p.features||[]).map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
<div class="bds">${(p.badges||[]).map(b=>`<span>${esc(b[0])} ${esc(b[1])}</span>`).join('')}</div>
<div class="buy">${buy}${p.lykdUrl?`<a class="btn y" target="_blank" rel="noopener" href="${esc(p.lykdUrl)}">Beli via Lykd</a>`:''}
<div class="row2"><button class="btn wh" data-like="${esc(p.id)}" id="dl">${liked.has(p.id)?'❤️ Tersimpan':'🤍 Simpan'}</button><button class="btn wh" id="share">Bagikan</button></div></div></div></div>
<div class="bb"><div><small>Harga</small><b>${rp(p.price)}</b></div>${buy}</div>`}

const NAV=[['#/','Beranda','home'],['#/promo','Promo','tag'],['#/saved','Tersimpan','heart'],['#/profil','Profil','user']];
function route(){const h=location.hash||'#/',[,a='',b]=h.split('/');let out;
 document.body.className=a==='produk'?'det':'';
 if(ERR)out='<div class="empty">data.json tidak bisa dimuat. Pastikan file data.json ada di folder yang sama dengan index.html, lalu buka lewat website (bukan klik dua kali file).</div>';
 else if(a==='produk')out=detail(PRODUCTS.find(x=>x.id===b));
 else if(a==='promo')out=catalog('',PRODUCTS.filter(disc),'Promo & diskon',0,'Belum ada promo saat ini.');
 else if(a==='saved')out=catalog('',PRODUCTS.filter(x=>liked.has(x.id)),'Produk tersimpan',0,'Belum ada yang disimpan. Ketuk ikon hati pada produk untuk menyimpannya.');
 else if(a==='profil')out=profile();
 else if(a==='kategori')out=catalog(b,PRODUCTS.filter(x=>x.cat===b),catName(b)||'Kategori',1);
 else out=home();
 view.innerHTML=out.startsWith('<div class="c">')?out:'<div class="c">'+out+'</div>';
 const on=n=>n[0]==='#/'?(a===''||a==='kategori'):h.startsWith(n[0]);
 $('#tab').innerHTML=NAV.map(n=>`<a href="${n[0]}" class="${on(n)?'on':''}">${ic(n[2])}${n[1]}</a>`).join('');
 $('#dn').innerHTML=NAV.map(n=>`<a href="${n[0]}" class="${on(n)?'on':''}">${n[1]}</a>`).join('');
 const p=a==='produk'&&PRODUCTS.find(x=>x.id===b);document.title=p?p.name+' · '+STORE.name:STORE.name;
 scrollTo(0,0);
 const q=$('#q'),so=$('#so');if(so)so.value=S.sort;
 if(q)q.oninput=e=>{S.q=e.target.value;$('#res').innerHTML=list()};
 if(so)so.onchange=e=>{S.sort=e.target.value;$('#res').innerHTML=list()};
}
document.addEventListener('click',e=>{
 const lk=e.target.closest('[data-like]');
 if(lk){e.stopPropagation();const id=lk.dataset.like,p=PRODUCTS.find(x=>x.id===id);liked.has(id)?liked.delete(id):liked.add(id);saveLiked();toast(liked.has(id)?'Disimpan ❤️':'Dihapus dari tersimpan');
  if(lk.id==='dl')lk.textContent=liked.has(id)?'❤️ Tersimpan':'🤍 Simpan';else{lk.classList.toggle('on',liked.has(id));lk.querySelector('span').textContent=fmt((p.likes||0)+(liked.has(id)?1:0))}return}
 const g=e.target.closest('[data-g]');if(g){$('#gal').innerHTML=galItem(R.gal[+g.dataset.g]);document.querySelectorAll('.th').forEach(t=>t.classList.toggle('on',t===g));return}
 const go=e.target.closest('[data-go]');if(go){e.preventDefault();$('#'+go.dataset.go)?.scrollIntoView({behavior:'smooth'});return}
 if(e.target.closest('#share')){const u=location.href;navigator.share?navigator.share({title:document.title,url:u}).catch(()=>{}):navigator.clipboard?.writeText(u).then(()=>toast('Link disalin'));return}
 const c=e.target.closest('[data-open]');if(c)location.hash='#/produk/'+c.dataset.open});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset?.open)location.hash='#/produk/'+e.target.dataset.open});
addEventListener('hashchange',route);

function boot(){
 const c=SITE.colors;for(const k in c)document.documentElement.style.setProperty('--'+k,c[k]);
 const n=STORE.name||'Toko';$('#brand').textContent=n;$('.logo i').textContent=n[0];
 $('#wa').href='https://wa.me/'+(STORE.whatsapp||'');
 if(SITE.announce){$('#ann').textContent=SITE.announce;$('#ann').hidden=false}
 $('#foot').innerHTML=`<nav>${(STORE.socials||[]).map(s=>`<a target="_blank" rel="noopener" href="${esc(s.url)}">${esc(s.label)}</a>`).join('')}</nav>© ${new Date().getFullYear()} ${esc(n)}. Semua hak dilindungi.`;
 route()}
fetch('data.json?'+Date.now()).then(r=>r.ok?r.json():Promise.reject()).then(d=>{STORE=d.STORE;CATEGORIES=d.CATEGORIES||[];PRODUCTS=d.PRODUCTS||[];SITE={...SITE0,...d.SITE,colors:{...SITE0.colors,...(d.SITE||{}).colors}}}).catch(()=>{ERR=1}).finally(boot);
</script>
</body>
</html>
